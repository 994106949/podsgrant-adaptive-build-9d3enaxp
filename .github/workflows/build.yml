name: Build PodsGrant RootHide

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  aacpdiag:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          brew install ldid dpkg

      - name: Prepare RootHide Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          git clone --depth=1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          cp -R "$RUNNER_TEMP/theos-sdks/." "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Validate diagnostic plist files
        run: |
          find aacpdiag -name "*.plist" -print0 |
            while IFS= read -r -d '' plist; do plutil -lint "$plist"; done

      - name: Stage RootHide package scripts
        run: |
          chmod +x aacpdiag/layout/DEBIAN/postinst
          chmod +x aacpdiag/layout/DEBIAN/postrm

      - name: Build independent RootHide diagnostic package
        run: |
          cd aacpdiag
          make clean package FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide \
            TARGET=iphone:clang:16.5:13.0

      - name: Verify package contents
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys

          packages = list(pathlib.Path("aacpdiag/packages").glob("*.deb"))
          if len(packages) != 1:
              raise SystemExit(f"expected one package, found {packages}")
          subprocess.run(
              [sys.executable, "aacpdiag/tools/verify_package.py", str(packages[0])],
              check=True,
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: PodsGrant-AACP-Diagnostics-roothide
          path: aacpdiag/packages/*.deb
          if-no-files-found: error
