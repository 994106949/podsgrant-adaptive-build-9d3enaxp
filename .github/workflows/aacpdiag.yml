name: Build PodsGrant AACP Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - aacpdiag-source.tar.gz

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          brew install ldid dpkg

      - name: Prepare RootHide Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          git clone --depth=1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          cp -R "$RUNNER_TEMP/theos-sdks/." "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Extract diagnostic source
        run: |
          tar -xzf aacpdiag-source.tar.gz
          chmod +x aacpdiag/layout/DEBIAN/postinst aacpdiag/layout/DEBIAN/postrm
          find aacpdiag -name "*.plist" -print0 | while IFS= read -r -d '' plist; do plutil -lint "$plist"; done

      - name: Build RootHide package
        run: |
          cd aacpdiag
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide TARGET=iphone:clang:16.5:13.0

      - name: Verify package
        run: |
          python3 aacpdiag/tools/verify_package.py aacpdiag/packages/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: PodsGrant-AACP-Diagnostics-roothide
          path: aacpdiag/packages/*.deb
          if-no-files-found: error
